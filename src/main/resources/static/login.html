<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Enterprise Knowledge Assistant</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <div class="auth-brand">
        <div class="auth-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <h1>Enterprise Knowledge</h1>
        <p>Grounded RAG Assistant & Hybrid Vector Search</p>
        <div class="auth-badge-row">
          <span class="badge-groq">GROQ LPU</span>
          <span class="citation-tag">PGVECTOR</span>
        </div>
      </div>

      <!-- Alert Messages -->
      <div id="authAlert" class="auth-alert">
        <span id="authAlertText"></span>
      </div>

      <!-- Sign In Form -->
      <form id="loginForm" class="auth-form" autocomplete="on">
        <div class="form-group">
          <label for="emailInput">Work Email</label>
          <input type="email" id="emailInput" class="form-input" placeholder="name@company.com" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="btnSubmit" class="btn-auth-submit">
          <span id="btnText">Sign In to Workspace</span>
          <svg id="btnSpinner" style="display:none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin">
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
          </svg>
        </button>
      </form>

      <!-- Links -->
      <div class="auth-footer-links">
        Don't have an account? <a href="/register.html">Create an Account</a>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const btnSubmit = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const authAlert = document.getElementById('authAlert');
      const authAlertText = document.getElementById('authAlertText');

      // Check URL query parameters for notifications (e.g. from registration)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('registered') === 'true') {
        const registeredEmail = urlParams.get('email');
        if (registeredEmail) {
          emailInput.value = registeredEmail;
        }
        showAlert('Registration successful! Please sign in with your credentials.', 'success');
      }

      function showAlert(msg, type = 'error') {
        authAlert.className = `auth-alert auth-alert-${type} show`;
        authAlertText.textContent = msg;
      }

      function hideAlert() {
        authAlert.className = 'auth-alert';
        authAlertText.textContent = '';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showAlert('Please fill in both email and password.');
          return;
        }

        btnSubmit.disabled = true;
        btnText.textContent = 'Authenticating...';
        btnSpinner.style.display = 'inline-block';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json().catch(() => null);

          if (!res.ok) {
            const errorMsg = (data && data.message) || 'Invalid email or password. Please verify credentials.';
            throw new Error(errorMsg);
          }

          // Build Basic Auth header for API calls
          const authHeader = 'Basic ' + btoa(email + ':' + password);

          const userSession = {
            userId: data.data.userId,
            email: data.data.email,
            fullName: data.data.fullName,
            role: data.data.role,
            authHeader: authHeader,
            password: password
          };

          localStorage.setItem('rag_user', JSON.stringify(userSession));
          showAlert(`Welcome back, ${data.data.fullName}! Redirecting...`, 'success');

          setTimeout(() => {
            window.location.href = '/index.html';
          }, 400);

        } catch (err) {
          showAlert(err.message, 'error');
          btnSubmit.disabled = false;
          btnText.textContent = 'Sign In to Workspace';
          btnSpinner.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
