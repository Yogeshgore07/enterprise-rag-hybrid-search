<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Enterprise Knowledge Assistant</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <div class="auth-brand">
        <div class="auth-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
        </div>
        <h1>Create Account</h1>
        <p>Join the Enterprise Knowledge & Hybrid RAG Workspace</p>
      </div>

      <!-- Alert Messages -->
      <div id="authAlert" class="auth-alert">
        <span id="authAlertText"></span>
      </div>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form" autocomplete="on">
        
        <div class="form-group">
          <label for="nameInput">Full Name</label>
          <input type="text" id="nameInput" class="form-input" placeholder="e.g. Alex Mercer" required autofocus autocomplete="name">
        </div>

        <div class="form-group">
          <label for="emailInput">Work Email</label>
          <input type="email" id="emailInput" class="form-input" placeholder="name@company.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="passwordInput">Password (min. 6 characters)</label>
          <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>

        <!-- Account Scope Info -->
        <div style="font-size:0.75rem; color:var(--text-secondary); background:rgba(6,182,212,0.06); border:1px solid rgba(6,182,212,0.2); padding:10px 14px; border-radius:var(--radius-md); display:flex; align-items:center; gap:10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--cyan); flex-shrink:0;">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>All registered accounts are standard user accounts with search scoped strictly to your personal ingested documents.</span>
        </div>

        <button type="submit" id="btnSubmit" class="btn-auth-submit">
          <span id="btnText">Create Account</span>
          <svg id="btnSpinner" style="display:none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin">
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
          </svg>
        </button>
      </form>

      <!-- Links -->
      <div class="auth-footer-links">
        Already have an account? <a href="/login.html">Sign In</a>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');
      const nameInput = document.getElementById('nameInput');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const btnSubmit = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const authAlert = document.getElementById('authAlert');
      const authAlertText = document.getElementById('authAlertText');

      function showAlert(msg, type = 'error') {
        authAlert.className = `auth-alert auth-alert-${type} show`;
        authAlertText.textContent = msg;
      }

      function hideAlert() {
        authAlert.className = 'auth-alert';
        authAlertText.textContent = '';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const fullName = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const role = 'ROLE_USER';

        if (!fullName || !email || !password) {
          showAlert('Please complete all required fields.');
          return;
        }

        if (password.length < 6) {
          showAlert('Password must be at least 6 characters long.');
          return;
        }

        btnSubmit.disabled = true;
        btnText.textContent = 'Creating Account...';
        btnSpinner.style.display = 'inline-block';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName, email, password, role })
          });

          const data = await res.json().catch(() => null);

          if (!res.ok) {
            const errorMsg = (data && data.message) || 'Registration failed. Please try a different email.';
            throw new Error(errorMsg);
          }

          showAlert('Account registered successfully! Redirecting to sign in...', 'success');

          setTimeout(() => {
            window.location.href = `/login.html?registered=true&email=${encodeURIComponent(email)}`;
          }, 800);

        } catch (err) {
          showAlert(err.message, 'error');
          btnSubmit.disabled = false;
          btnText.textContent = 'Create Account';
          btnSpinner.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
