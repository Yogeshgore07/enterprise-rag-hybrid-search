# ==========================================================
# Server Configuration
# ==========================================================
server.port=${PORT:${SERVER_PORT:8501}}
server.servlet.context-path=/

# ==========================================================
# Spring Application
# ==========================================================
spring.application.name=enterprise-rag-hybrid-search

# ==========================================================
# Database & Hibernate Configuration (No Flyway)
# ==========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rag_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:raguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ragpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==========================================================
# Enterprise RAG Pipeline Properties
# ==========================================================
rag.chunking.chunk-size=600
rag.chunking.chunk-overlap=120
rag.chunking.separators=\n\n,\n,. ,? ,! ,; , ,

# Embedding Provider (mock)
rag.embedding.provider=${EMBEDDING_PROVIDER:mock}
rag.embedding.dimension=1536

# LLM Provider (groq, mock)
rag.llm.provider=${LLM_PROVIDER:groq}
rag.llm.temperature=0.1
rag.llm.max-tokens=2048
rag.llm.groq.api-key=${GROQ_API_KEY:}
rag.llm.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
rag.llm.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}

# Hybrid Retrieval Settings
rag.retrieval.top-k=15
rag.retrieval.final-k=5
rag.retrieval.vector-weight=0.6
rag.retrieval.keyword-weight=0.4
rag.retrieval.min-score-threshold=0.10

# Cross-Encoder Reranker
rag.reranker.enabled=${RERANKER_ENABLED:false}
rag.reranker.provider=${RERANKER_PROVIDER:noop}
rag.reranker.bge.endpoint=${BGE_RERANKER_URL:http://localhost:8001/rerank}
rag.reranker.bge.model=BAAI/bge-reranker-large
rag.reranker.bge.timeout-seconds=10

# ==========================================================
# OpenAPI / Swagger UI
# ==========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ==========================================================
# Logging
# ==========================================================
logging.level.root=INFO
logging.level.com.yogesh.ragassistant=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=*