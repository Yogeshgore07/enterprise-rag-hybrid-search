# Test Configuration with H2 and Mock AI
spring.datasource.url=jdbc:h2:mem:ragtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

rag.chunking.chunk-size=600
rag.chunking.chunk-overlap=120
rag.chunking.separators=\n\n,\n,. , ,

rag.embedding.provider=mock
rag.embedding.dimension=1536
rag.llm.provider=mock

rag.retrieval.top-k=10
rag.retrieval.final-k=5
rag.retrieval.vector-weight=0.6
rag.retrieval.keyword-weight=0.4
rag.retrieval.min-score-threshold=0.05
rag.reranker.enabled=false
rag.reranker.provider=noop

logging.level.root=INFO
logging.level.com.yogesh.ragassistant=DEBUG
